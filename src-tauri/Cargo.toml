[package]
name = "ai-teacher-assistant"
version = "0.1.0"
description = "AI Teacher Assistant desktop application"
edition = "2021"
rust-version = "1.77.2"
authors = ["Nasir-dpk"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ai_teacher_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
